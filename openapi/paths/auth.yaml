# Alta, activación y reenvío. Primer corte de implementación.
#
# Semántica en docs/api/endpoints/user.md y en las fichas:
#   FEAT-USR-001, FEAT-USR-002, FEAT-USR-020, FEAT-USR-021, FEAT-USR-024

register:
  post:
    tags: [Auth]
    operationId: registerUser
    summary: Registrarse con correo y contraseña
    description: |
      Crea una cuenta en `PENDING_ACTIVATION` y envía el correo de activación.

      La cuenta **no puede escribir** hasta activarse
      (`decision:0003`) y **no tiene saldo**: los créditos de bienvenida se
      abonan al activar (`FEAT-CRD-002`).

      La respuesta es **la misma exista o no ya ese correo**. Decir «ese correo
      ya está registrado» convertiría el formulario en un comprobador de quién
      tiene cuenta en la plataforma.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/RegisterRequest'
    responses:
      '202':
        description: Solicitud aceptada. Si procede, se ha enviado el correo de activación.
      '422':
        $ref: '../openapi.yaml#/components/responses/ValidationError'
      '429':
        description: |
          `code: RESEND_TOO_SOON` o `code: RESEND_LIMIT_REACHED`. Los dos
          llevan `Retry-After` y repiten la cifra en `retryAfterSeconds`.
        headers:
          Retry-After:
            schema:
              type: integer
        content:
          application/problem+json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/Problem'
                - type: object
                  properties:
                    retryAfterSeconds:
                      type: integer
                      minimum: 0

activate:
  post:
    tags: [Auth]
    operationId: activateAccount
    summary: Activar la cuenta con el token del correo
    description: |
      Consume el token y pasa la cuenta a `ACTIVE`. A partir de ese momento se
      desbloquean las operaciones de escritura y se abonan los **10 créditos**
      de bienvenida (`decision:0006`).

      El token es de un solo uso y caduca.

      **No devuelve sesión.** El enlace se abre a menudo en un dispositivo
      distinto de aquel en que se creó la cuenta, y emitir ahí una sesión
      convertiría un enlace de correo en una credencial de acceso. Quien tenga
      la sesión abierta la conserva; quien no, inicia sesión con normalidad.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
                minLength: 32
    responses:
      '204':
        description: |
          Cuenta activada. Idempotente: activar una cuenta ya activa devuelve
          lo mismo (`FEAT-USR-020` `RN-3`).
      '404':
        description: |
          Token inexistente, ya usado o manipulado. **Los tres casos son
          indistinguibles** a propósito (`RN-5`).
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '410':
        description: |
          El token ha caducado. Este sí se distingue, porque hay que ofrecer
          el reenvío (`FEAT-USR-021`).
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '422':
        $ref: '../openapi.yaml#/components/responses/ValidationError'

resend:
  post:
    tags: [Auth]
    operationId: resendActivationEmail
    summary: Reenviar el correo de activación
    description: |
      **No requiere sesión** (`R-1`): basta con el correo. Sin esto, quien
      cierra el navegador antes de activar se queda atrapado, porque no puede
      entrar y tampoco pedir el reenvío.

      La respuesta es **idéntica** en los tres casos posibles —el correo no
      existe, existe sin activar, ya está activada—. Cualquier diferencia
      observable filtraría quién tiene cuenta. Por lo mismo, un correo mal
      formado también responde `202`.

      Cada reenvío **invalida el enlace anterior** (`RN-1`): solo vale el del
      último correo.

      El `429` sí distingue dos casos, con `Retry-After` en los dos:
      `RESEND_TOO_SOON` es «espera un minuto» y `RESEND_LIMIT_REACHED` es
      «vuelve mañana». No filtra nada, porque los contadores se consumen en
      cada petición exista o no la cuenta.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
    responses:
      '202':
        description: Solicitud aceptada. Si procedía, se ha enviado el correo.
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

oauthCallback:
  post:
    tags: [Auth]
    operationId: completeOAuth
    summary: Completar el alta o el acceso con un proveedor externo
    description: |
      Solo `google` en esta fase (`FEAT-USR-002`).

      **La cuenta nace activada** (`OB-11`): Google ya ha verificado el correo,
      así que mandar otro correo de activación sería pedirle al usuario que
      demuestre algo ya demostrado. Los créditos de bienvenida se abonan en el
      alta.

      La **aceptación legal sigue siendo obligatoria**: sin ella no se crea la
      cuenta, venga de donde venga (`T-4`).
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, acceptedLegalVersions]
            properties:
              code:
                type: string
              acceptedLegalVersions:
                $ref: '../openapi.yaml#/components/schemas/LegalAcceptance'
    responses:
      '200':
        description: Sesión iniciada.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Session'
      '422':
        $ref: '../openapi.yaml#/components/responses/ValidationError'

login:
  post:
    tags: [Auth]
    operationId: login
    summary: Iniciar sesión con correo y contraseña
    description: |
      Devuelve un token de acceso de **15 minutos** y un token de refresco
      revocable (`decision:0007`).

      **Una cuenta sin activar inicia sesión con normalidad**: el onboarding
      ocurre antes de activar. Lo que no puede es escribir
      (`FEAT-USR-025`).

      Credenciales incorrectas, cuenta inexistente, cuenta dada de alta con
      Google y cuenta eliminada dan **exactamente la misma respuesta**
      (`FEAT-USR-004` `RN-2`), y el servidor verifica una contraseña ficticia
      cuando el correo no existe para que tampoco el **tiempo** los distinga.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
    responses:
      '200':
        description: Sesión iniciada.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Session'
      '401':
        description: 'Credenciales no válidas. `code: INVALID_CREDENTIALS`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '403':
        description: |
          Cuenta bloqueada. `code: ACCOUNT_BLOCKED`.

          Se distingue a propósito: solo llega aquí quien ya ha acertado la
          contraseña, y callarlo dejaría a una persona sancionada creyendo
          que la ha olvidado.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '429':
        $ref: '../openapi.yaml#/components/responses/TooManyRequests'

refresh:
  post:
    tags: [Auth]
    operationId: refreshSession
    summary: Renovar la sesión
    description: |
      **El token de refresco rota**: el presentado queda revocado y se
      entrega uno nuevo, así que sirve una sola vez (`FEAT-USR-004` `RN-10`).

      Presentar uno **ya revocado** revoca todas las sesiones del usuario
      (`RN-11`): que dos partes tengan el mismo token no tiene lectura
      benigna, y es la única acción que expulsa a un ladrón sin saber cuál de
      los dos lo es.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken:
                type: string
    responses:
      '200':
        description: Sesión renovada.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Session'
      '401':
        description: 'Token de refresco inexistente, caducado o revocado. `code: INVALID_REFRESH_TOKEN`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '403':
        description: 'Cuenta bloqueada. `code: ACCOUNT_BLOCKED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

logout:
  post:
    tags: [Auth]
    operationId: logout
    summary: Cerrar sesión
    description: |
      Revoca el token de refresco presentado.

      **El token de acceso sigue siendo válido hasta 15 minutos**: un JWT no
      se puede retirar (`decision:0007`). Conviene no prometer lo contrario.

      Idempotente: un token inexistente o ya revocado también devuelve `204`.
      Distinguirlos diría a quien pregunta si ese token era real.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken:
                type: string
    responses:
      '204':
        description: Sesión cerrada.
