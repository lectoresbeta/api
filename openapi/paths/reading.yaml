# Quién puede leer qué, y cómo llegó a poder hacerlo.
#
# Convertirse en lector beta de una obra PUBLIC no aparece aquí y no es un
# olvido: no tiene endpoint. Es el efecto de empezar una corrección
# (FEAT-RDG-001). Los tres caminos producen el mismo acceso; solo dos son
# pantallas.

AccessRequestStatus:
  type: string
  enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]

AccessRequest:
  type: object
  required: [requestId, workId, readerId, status, requestedAt]
  properties:
    requestId:
      type: string
      format: uuid
    workId:
      type: string
      format: uuid
    workTitle:
      type: [string, 'null']
      description: |
        Nulo solo si la obra ha dejado de existir y el cierre de sus
        solicitudes todavía no ha llegado. Una fila sin título es mejor que
        una lista que falla.
    readerId:
      type: string
      format: uuid
      description: Quién pide. El autor lo mira; el propio solicitante, no.
    status:
      $ref: '#/AccessRequestStatus'
    message:
      type: [string, 'null']
      description: |
        Lo que el lector escribió para convencer. Es lo único que convierte
        una lista de identificadores en una decisión que se pueda tomar.
    requestedAt:
      type: string
      format: date-time
    resolvedAt:
      type: [string, 'null']
      format: date-time

AccessRequestPage:
  type: object
  required: [requests, pageInfo]
  properties:
    requests:
      type: array
      items:
        $ref: '#/AccessRequest'
    pageInfo:
      type: object
      required: [nextCursor, hasNextPage]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaco. No se construye a mano.
        hasNextPage:
          type: boolean

collection:
  post:
    tags: [Reading]
    operationId: requestBetaReaderAccess
    summary: Pedir ser lector beta de una obra
    description: |
      El camino de entrada a una obra **abierta a solicitud**, que es la
      modalidad con la que nace toda obra.

      Una solicitud **no concede nada**: es una pregunta con acuse de recibo,
      y lo único que produce por sí sola es un aviso al autor. Quien decide es
      él.

      Se puede volver a pedir después de un rechazo. No hay enfriamiento:
      cerrar la puerta tras un «no» lo convertiría en un «nunca», y el caso
      normal —una obra que ya tiene diez lectores hoy y no dentro de dos
      meses— dejaría de tener salida.
    parameters:
      - name: workId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: |
                  Opcional, y lo que hace que el autor pueda decidir. En
                  blanco cuenta como no escrito.
    responses:
      '201':
        description: La solicitud queda pendiente.
        content:
          application/json:
            schema:
              type: object
              required: [requestId, status]
              properties:
                requestId: { type: string, format: uuid }
                status: { $ref: '#/AccessRequestStatus' }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: |
          `code: WORK_NOT_FOUND`. **Cuatro situaciones, una respuesta**: la
          obra no existe, es el borrador de otra persona, está bloqueada por
          reclamación, o es para adultos y quien pregunta no tiene edad
          declarada. Distinguirlas sería decirle a un desconocido algo de
          obra que no está publicada.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: |
          `code: ALREADY_A_BETA_READER` si ya tiene acceso vivo, o
          `REQUEST_ALREADY_PENDING` si ya hay una solicitud abierta suya sobre
          esta obra.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '422':
        description: |
          `code: WORK_DOES_NOT_TAKE_REQUESTS` cuando la obra es `PUBLIC` o
          `PRIVATE`. Caen en el mismo error por motivos opuestos: en una no
          hace falta pedir nada —basta con ponerse a corregir— y en la otra
          pedir no es la vía de entrada.

          `AUTHOR_CANNOT_BE_BETA_READER` cuando es el autor quien pide. Aquí
          **no** se finge que la obra no existe: la está viendo, y mentirle
          sobre algo suyo le confundiría.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

  get:
    tags: [Reading]
    operationId: listWorkAccessRequests
    summary: Quién quiere leer mi obra
    description: |
      La bandeja del autor. Por defecto enseña **lo pendiente**, que es lo que
      se viene a mirar; el histórico está a un filtro de distancia.

      La obra de otra persona responde `404`, igual que una inexistente.
    parameters:
      - name: workId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: |
          `ALL` para el histórico entero. Un valor que no existe devuelve
          `422` en lugar de ignorarse: servir otra lista dejaría a quien
          pregunta sin forma de notarlo.
        schema:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, ALL]
          default: PENDING
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: |
          Una página de solicitudes, por cursor: es una bandeja cronológica y
          no un catálogo sobre el que se salte. Tampoco lleva total — nadie
          necesita saber que tiene 413 solicitudes, necesita las veinte
          siguientes.
        content:
          application/json:
            schema:
              $ref: '#/AccessRequestPage'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '422':
        description: '`code: UNKNOWN_FILTER_VALUE` o `INVALID_CURSOR`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

mine:
  get:
    tags: [Reading]
    operationId: listMyBetaReaderAccessRequests
    summary: Lo que he pedido
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, ALL]
          default: PENDING
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Mis solicitudes, de la más reciente a la más antigua.
        content:
          application/json:
            schema:
              $ref: '#/AccessRequestPage'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        description: '`code: UNKNOWN_FILTER_VALUE` o `INVALID_CURSOR`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

request:
  delete:
    tags: [Reading]
    operationId: cancelBetaReaderAccessRequest
    summary: Retirar mi solicitud
    description: |
      Retirarse de la cola mientras siga pendiente. **No avisa al autor**:
      nadie estaba esperando una pregunta que quien la hizo ha retirado. Es la
      asimetría deliberada con el rechazo, que sí se cuenta.

      Cancelar deja la vía libre para volver a pedir.
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Retirada.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: |
          `code: ACCESS_REQUEST_NOT_FOUND`. La solicitud de otra persona
          responde lo mismo que una inexistente.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: '`code: REQUEST_ALREADY_RESOLVED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

resolution:
  put:
    tags: [Reading]
    operationId: resolveBetaReaderAccessRequest
    summary: Aceptar o rechazar una solicitud
    description: |
      **Aceptar concede el acceso en el acto**, en la misma transacción que
      cierra la solicitud: los dos agregados son del mismo contexto, así que
      no hay ventana en la que la solicitud esté aceptada y el acceso todavía
      no exista. A partir de ahí el lector lee la obra **sea cual sea su
      modalidad**.

      Rechazar la cierra y se lo dice al lector. **No se pide motivo**: si
      decir que no costara escribir una justificación, la salida fácil sería
      no contestar nunca, y el lector se quedaría sin acceso y sin respuesta.

      Un `PUT` con la decisión, y no dos rutas `accept` y `reject`: es una
      transición de estado con dos valores, igual que el estado de una obra.

      **No se comprueba la modalidad de la obra.** Entre la solicitud y su
      respuesta el autor pudo cambiarla, y aceptar igual es lo correcto: la
      modalidad gobierna quién puede entrar a partir de ahora, no quién ya
      estaba pidiendo entrar. Si cambió de opinión, tiene el rechazo delante.
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                type: string
                enum: [ACCEPTED, REJECTED]
    responses:
      '200':
        description: Cómo ha quedado la solicitud.
        content:
          application/json:
            schema:
              type: object
              required: [requestId, status]
              properties:
                requestId: { type: string, format: uuid }
                status: { $ref: '#/AccessRequestStatus' }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: |
          `code: ACCESS_REQUEST_NOT_FOUND`. La solicitud de la obra de otra
          persona responde igual que una inexistente.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: '`code: REQUEST_ALREADY_RESOLVED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '410':
        description: |
          `code: WORK_GONE`. La obra se borró mientras la solicitud esperaba.
          `410` y no `404` porque quien resuelve conoce esa obra —es suya— y
          fingir que nunca existió sería mentirle sobre algo que hizo él.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '422':
        description: |
          `code: UNKNOWN_DECISION`. **Nunca se interpreta como un rechazo**:
          adivinar en una operación que concede acceso a obra inédita es
          exactamente donde no conviene adivinar.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

AccessInvitationStatus:
  type: string
  enum: [PENDING, ACCEPTED, DECLINED, CANCELLED]

BetaReaderInvitation:
  type: object
  required: [invitationId, workId, adultsOnly, contentWarnings, authorId, readerId, status, invitedAt]
  properties:
    invitationId:
      type: string
      format: uuid
    workId:
      type: string
      format: uuid
    workTitle:
      type: [string, 'null']
    workSynopsis:
      type: [string, 'null']
      description: |
        Sin truncar, al contrario que en la tarjeta del catálogo: quien decide
        si acepta **no ha podido ojear la obra** —puede ser privada o un
        borrador— y esto es lo único que tiene para decidir.
    adultsOnly:
      type: boolean
      description: |
        Una obra que ha dejado de existir sale marcada como para adultos: ante
        la duda, el aviso prudente es el que no promete que algo es
        inofensivo.
    contentWarnings:
      type: array
      items:
        $ref: './works.yaml#/ContentWarning'
      description: |
        **Antes de aceptar**, que es cuando sirve de algo. Es el único sitio
        del producto donde alguien decide leer algo sin haberlo visto en el
        catálogo.
    authorId:
      type: string
      format: uuid
    readerId:
      type: string
      format: uuid
    status:
      $ref: '#/AccessInvitationStatus'
    message:
      type: [string, 'null']
      description: |
        Lo que el autor escribió con la oferta. En una obra inédita, «te
        invito a leer lo que llevo» dice mucho más que un aviso seco.
    invitedAt:
      type: string
      format: date-time
    resolvedAt:
      type: [string, 'null']
      format: date-time

BetaReaderInvitationPage:
  type: object
  required: [invitations, pageInfo]
  properties:
    invitations:
      type: array
      items:
        $ref: '#/BetaReaderInvitation'
    pageInfo:
      type: object
      required: [nextCursor, hasNextPage]
      properties:
        nextCursor:
          type: [string, 'null']
        hasNextPage:
          type: boolean

invitations:
  post:
    tags: [Reading]
    operationId: inviteBetaReader
    summary: Invitar a alguien a ser lector beta
    description: |
      El autor elige a quién quiere dentro. Es el **único camino de entrada a
      una obra privada** y el único de los tres que empieza por el autor.

      Una invitación no concede nada: es una oferta, y decide quien la recibe.

      **Se puede invitar en cualquier modalidad, incluida la abierta**, aunque
      solicitar en una obra abierta se rechace. La asimetría parece
      incoherente hasta que se mira quién trabaja: una solicitud le pide al
      autor que haga algo por alguien que ya podía entrar solo, y una
      invitación es el autor decidiendo hacerlo. Además dice algo que la
      modalidad no dice: *quiero que tú la leas*.

      **Y se puede invitar a un borrador**, que es probablemente el caso más
      valioso. El invitado acepta y **no lee nada hasta que la obra se
      publique**: la invitación espera.

      Se invita por identificador de usuario, no por correo. Invitar por
      correo sería otra cosa —una invitación a la plataforma— y conviene no
      mezclarlas: una ofrece leer una obra, la otra ofrece una cuenta.
    parameters:
      - name: workId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [userId]
            properties:
              userId:
                type: string
                format: uuid
              message:
                type: string
    responses:
      '201':
        description: La invitación queda pendiente.
        content:
          application/json:
            schema:
              type: object
              required: [invitationId, status]
              properties:
                invitationId: { type: string, format: uuid }
                status: { $ref: '#/AccessInvitationStatus' }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: |
          `code: WORK_NOT_FOUND`. La obra de otra persona responde igual que
          una inexistente.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: |
          `code: ALREADY_A_BETA_READER`, `INVITATION_ALREADY_PENDING`, o
          `REQUEST_ALREADY_PENDING` si esa persona ya pidió acceso — ahí lo
          que toca es aceptar su solicitud, no crear un segundo objeto que
          significa lo mismo.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '422':
        description: |
          `code: USER_NOT_FOUND` si no existe esa persona — se nombra el
          motivo porque el autor la eligió, y decirle que la obra no existe
          sería contestar a otra cosa. `AUTHOR_CANNOT_BE_BETA_READER` si se
          invita a sí mismo.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

  get:
    tags: [Reading]
    operationId: listWorkBetaReaderInvitations
    summary: A quién le he ofrecido mi obra
    parameters:
      - name: workId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, CANCELLED, ALL]
          default: PENDING
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Una página de invitaciones, por cursor.
        content:
          application/json:
            schema:
              $ref: '#/BetaReaderInvitationPage'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '422':
        description: '`code: UNKNOWN_FILTER_VALUE` o `INVALID_CURSOR`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

myInvitations:
  get:
    tags: [Reading]
    operationId: listMyBetaReaderInvitations
    summary: Lo que me han ofrecido
    description: |
      Cada fila lleva **sinopsis y clasificación de contenido** de la obra,
      además del mensaje de quien invita. No es adorno: aceptar una invitación
      es el único momento del producto en que alguien se compromete a leer
      algo que no ha podido ojear.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, CANCELLED, ALL]
          default: PENDING
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Mis invitaciones, de la más reciente a la más antigua.
        content:
          application/json:
            schema:
              $ref: '#/BetaReaderInvitationPage'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '422':
        description: '`code: UNKNOWN_FILTER_VALUE` o `INVALID_CURSOR`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

invitation:
  delete:
    tags: [Reading]
    operationId: cancelBetaReaderInvitation
    summary: Retirar una invitación
    description: |
      Solo el autor, y solo mientras siga pendiente.

      **No avisa al invitado**, y es discutible: ya recibió el aviso y puede
      llegar a una oferta que ya no está. Se ha preferido no inventar un
      evento cuyo consumidor no está especificado, y que quien llegue tarde
      reciba un `409` claro.
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Retirada.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: '`code: INVITATION_NOT_FOUND`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: '`code: INVITATION_ALREADY_RESOLVED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

invitationResolution:
  put:
    tags: [Reading]
    operationId: resolveBetaReaderInvitation
    summary: Aceptar o rechazar una invitación
    description: |
      **Aceptar concede el acceso en el acto**, en la misma transacción que
      cierra la invitación. A partir de ahí se lee la obra sea cual sea su
      modalidad — salvo que siga siendo un borrador, en cuyo caso la
      invitación queda aceptada y se espera a la publicación.

      Rechazar la cierra y **sí se lo dice al autor**, al contrario que
      cancelar una solicitud. No es incoherente: quien cancela retira una
      pregunta suya y nadie esperaba; quien rechaza contesta a alguien que sí,
      y un autor que ofreció su obra inédita a una persona concreta merece
      saber que es un no.

      `DECLINED` y no `REJECTED`: un autor **rechaza** la petición de un
      desconocido, un lector **declina** una oferta que le han hecho.

      Solo el destinatario resuelve. Ni siquiera el autor que la envió — él la
      retira.
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                type: string
                enum: [ACCEPTED, DECLINED]
    responses:
      '200':
        description: Cómo ha quedado la invitación.
        content:
          application/json:
            schema:
              type: object
              required: [invitationId, status]
              properties:
                invitationId: { type: string, format: uuid }
                status: { $ref: '#/AccessInvitationStatus' }
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: 'La cuenta no está activada. `code: ACCOUNT_NOT_ACTIVATED`.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '404':
        description: |
          `code: INVITATION_NOT_FOUND`. La invitación dirigida a otra persona
          responde igual que una inexistente.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '409':
        description: '`code: INVITATION_ALREADY_RESOLVED`, también si el autor la retiró.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '410':
        description: '`code: WORK_GONE`. Le invitaron a algo que existió.'
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '422':
        description: |
          `code: UNKNOWN_DECISION`. Nunca se interpreta como un rechazo.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
