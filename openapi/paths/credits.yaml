# Saldo de créditos.
#
# Casi todo `Credits` funciona por eventos: no hay —ni debe haber— ninguna
# operación para sumar o restar créditos desde fuera (decision:0002).

balance:
  get:
    tags: [Credits]
    operationId: getCreditBalance
    summary: Consultar el saldo propio
    description: |
      Un **único** entero con signo. No hay «saldo disponible» frente a
      «saldo total» porque el sistema no retiene créditos
      (`decision:0006` §3): lo que se ve es lo que se tiene.

      Dos cosas que el cliente debe respetar:

      - **`balance` puede ser negativo** (`FEAT-CRD-018`). Un cliente que lo
        trate como natural mostrará cifras equivocadas justo cuando la
        persona más necesita entender qué pasa;
      - **una cuenta sin movimientos devuelve `0`, no `404`.** Es el estado
        normal de quien se ha registrado y aún no ha activado.

      No existe forma de consultar el saldo de otra persona. La vista
      agregada de la economía es `FEAT-CRD-012` y trabaja con totales.
    responses:
      '200':
        description: Saldo del usuario autenticado.
        headers:
          Cache-Control:
            schema:
              type: string
              examples: ['no-store, private']
        content:
          application/json:
            schema:
              type: object
              required: [balance]
              properties:
                balance:
                  type: integer
                  examples: [10]
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
movements:
  get:
    tags: [Credits]
    operationId: listCreditMovements
    summary: Mis movimientos de créditos
    description: |
      Todo lo que ha movido el saldo, de lo más reciente a lo más antiguo.

      **Es la invariante del contexto, enseñada**: el saldo es la suma de sus
      movimientos, y esta lista permite comprobarlo en vez de creérselo. Cada
      apunte lleva el `balanceAfter` con el que quedó la cuenta, así que se
      puede seguir hacia atrás sin sumar a mano.

      Hace falta desde que una reclamación estimada puede **retirar créditos
      ya cobrados**, días después y sin que su dueño haya hecho nada
      ([`FEAT-MOD-002`](../../docs/features/moderation/FEAT-MOD-002-review-claim.md)).
      Una reversión aparece como **dos apuntes nuevos**, nunca como una
      corrección del original: los movimientos son inmutables.

      **El objeto va por referencia, no por nombre.** `Credits` no conoce el
      título de ninguna obra y no va a conocerlo: pedírselo a `Work` sería la
      dependencia que su aislamiento prohíbe. Quien pinte la pantalla resuelve
      los títulos donde viven.

      Cada uno ve **solo el suyo**. No hay forma de consultar el historial de
      otra persona, ni siquiera en parte.
    parameters:
      - name: reason
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: Los movimientos propios. Lista vacía y saldo cero si no hay cuenta todavía.
        content:
          application/json:
            schema:
              type: object
              required: [movements]
              properties:
                movements:
                  type: array
                  items:
                    type: object
                    required: [movementId, amount, reason, balanceAfter, occurredAt, reconstructedPrice]
                    properties:
                      movementId:
                        $ref: '../openapi.yaml#/components/schemas/Uuid'
                      amount:
                        type: integer
                        description: Con signo. Negativo es un cargo.
                      reason:
                        type: string
                      balanceAfter:
                        type: integer
                        description: El saldo con el que quedó la cuenta tras este apunte.
                      occurredAt:
                        type: string
                        format: date-time
                      correctionId:
                        type: [string, 'null']
                      chapterId:
                        type: [string, 'null']
                      workId:
                        type: [string, 'null']
                      claimId:
                        type: [string, 'null']
                      reconstructedPrice:
                        type: boolean
                        description: |
                          El precio se reconstruyó porque su cotización no
                          estaba. Una reparación que no deja rastro es
                          indistinguible de lo real cuando alguien audita
                          meses después.
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

