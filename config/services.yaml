parameters:
    app.jwt_ttl: 900          # 15 minutos — decision:0007

    # Dónde viven los ficheros subidos (FEAT-USR-037). Un directorio local es
    # con lo que se empieza; el día que haya más de una instancia sirviendo la
    # API hay que cambiar el adaptador, no este valor.
    app.storage_dir: '%env(resolve:APP_STORAGE_DIR)%'
    app.welcome_credits: 10   # decision:0006

    # Las palancas del precio de una corrección (decision:0006 regla 1,
    # FEAT-CRD-016 RN-7). Están aquí y no como literales en el código porque
    # son lo único que permite reequilibrar leer contra escribir, y una
    # palanca que exige desplegar no es una palanca.
    #
    # Moverlas es seguro para la economía: el precio es una transferencia
    # —lo que paga el autor es lo que cobra el lector—, así que ninguna de
    # estas cifras crea ni destruye créditos.
    app.pricing.words_per_reading_credit: 1000
    app.pricing.words_per_writing_credit: 100
    app.pricing.words_per_unbounded_question: 25   # el suelo por pregunta sin mínimo
    app.pricing.min_price: 2
    app.pricing.max_price: 20

    # Cuántas sugerencias de autor hacen falta para que el paso 3 del
    # onboarding merezca enseñarse, y cuántas se enseñan como mucho
    # (FEAT-COM-016). Por debajo del mínimo la pantalla no se percibe como una
    # recomendación sino como un catálogo vacío, así que el paso se omite.
    #
    # Es configuración y no una constante repartida por el código porque es
    # exactamente la palanca que habrá que mover según crezca la plataforma.
    app.suggestions.minimum: 3
    app.suggestions.maximum: 10

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Los chequeos de salud se etiquetan aquí y no con un atributo sobre la
    # interfaz: `HealthCheck` vive en Domain, y Domain no conoce Symfony.
    # Deptrac lo comprueba en cada ejecución.
    _instanceof:
        LectoresBeta\Shared\Domain\Health\HealthCheck:
            tags: ['lectoresbeta.health_check']

    # Autoregistro de todo el código propio, con tres exclusiones.
    #
    # Lo que se excluye del dominio son las cosas **con estado**: agregados,
    # entidades, value objects, enums, excepciones y eventos. Se construyen
    # con `new`; un agregado que el contenedor sabe crear acaba teniendo
    # dependencias de infraestructura.
    #
    # Lo que sí se registra del dominio son los **contratos de repositorio** y
    # los servicios de dominio sin estado. Registrar la interfaz junto a su
    # implementación es además lo que hace que Symfony las enlace sola, sin
    # una lista de alias que hay que mantener a mano.
    #
    # Los controladores no se registran aparte: llevan el atributo
    # #[AsController] de Symfony, que ya les pone la etiqueta
    # `controller.service_arguments`. Así el atributo se queda donde debe
    # estar, en Infrastructure.
    LectoresBeta\:
        resource: '../src/'
        exclude:
            - '../src/*/*/Domain/{Entity,ValueObject,Enum,Exception,Event}/'
            # Comandos, consultas y eventos entrantes son **mensajes**: los
            # construye quien los envía, con sus datos dentro. Los handlers
            # viven en `Application/Handler/` justo para poder separarlos
            # aquí, y por eso la convención de AGENTS.md los lista aparte.
            - '../src/*/*/Application/{Command,Query,Event,Contract,DTO}/'
            - '../src/Shared/Domain/{ValueObject,Exception,Event}/'
            # Dos valores que viven en carpetas de servicios. El contenedor
            # intentaría autoconectar sus strings, y son cosas que construye
            # quien las crea: el token, con su secreto dentro; el usuario
            # autenticado, con el identificador que venía en la petición.
            - '../src/Shared/Application/Security/SecureToken.php'
            # Lo mismo con los dos valores del almacenamiento de ficheros: un
            # fichero guardado y una imagen ya normalizada son datos que
            # devuelve un puerto, no servicios (FEAT-USR-037).
            - '../src/Shared/Application/Storage/StoredFile.php'
            - '../src/Shared/Application/Image/ProcessedImage.php'
            # Y la dirección pública de un fichero, que es una función.
            - '../src/Shared/Application/Storage/MediaUrl.php'
            # Un mensaje, no un servicio: lo construye el serializador con el
            # hecho que acaba de llegar dentro.
            - '../src/Shared/Infrastructure/Messenger/IncomingFacts.php'
            - '../src/User/Authentication/Infrastructure/Security/AuthenticatedUser.php'
            - '../src/Shared/Infrastructure/Symfony/Kernel.php'
            - '../src/Shared/Infrastructure/Symfony/PublicServicesForTestsPass.php'

    LectoresBeta\Shared\Application\Health\CheckHealth:
        arguments:
            $checks: !tagged_iterator lectoresbeta.health_check

    # A qué hechos publicados por otros contextos reacciona esta aplicación.
    #
    # Se declara a mano y no se descubre escaneando: suscribirse a un hecho
    # ajeno es una decisión de integración, y una decisión que vive en un
    # fichero se puede revisar. Con descubrimiento automático, una suscripción
    # nueva aparecería porque alguien añadió una clase.
    # Reparte un hecho entre los contextos que lo escuchan. Ver la clase:
    # `Messenger` decodifica en un objeto y aquí un hecho puede tener varios
    # dueños.
    LectoresBeta\Shared\Infrastructure\Messenger\DispatchIncomingFacts:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Community\Recommendation\Application\Handler\ListAuthorSuggestionsHandler:
        arguments:
            $minimum: '%app.suggestions.minimum%'
            $maximum: '%app.suggestions.maximum%'

    # La copia local de qué le interesa a cada persona: `Community` no
    # consulta la tabla de géneros de `User`, recibe el hecho (FEAT-COM-016).
    LectoresBeta\Community\Recommendation\Application\Handler\ProjectMemberGenres:
        tags:
            - { name: messenger.message_handler }

    # Tres hechos que mueven la misma fila, y un solo consumidor: tenerlos
    # juntos deja ver de un vistazo qué cambia los contadores por los que se
    # ordena una sugerencia.
    LectoresBeta\Community\Recommendation\Application\Handler\ProjectAuthorStats:
        tags:
            - { name: messenger.message_handler, method: followed }
            - { name: messenger.message_handler, method: unfollowed }
            - { name: messenger.message_handler, method: published }

    LectoresBeta\Shared\Infrastructure\Messenger\IncomingEventRegistry:
        arguments:
            $eventClasses:
                - LectoresBeta\Credits\Account\Application\Event\AccountActivated
                - LectoresBeta\Credits\Pricing\Application\Event\ChapterContentUpdated
                - LectoresBeta\Credits\Pricing\Application\Event\QuestionnaireUpdated
                - LectoresBeta\Credits\Pricing\Application\Event\CorrectionStarted
                - LectoresBeta\Credits\Pricing\Application\Event\CorrectionDraftDiscarded
                - LectoresBeta\Credits\Account\Application\Event\FeedbackSubmitted
                - LectoresBeta\Feedback\Correction\Application\Event\ChapterCorrectabilityChanged
                - LectoresBeta\Feedback\Correction\Application\Event\CreditBalanceWentNegative
                - LectoresBeta\Feedback\Correction\Application\Event\CreditDebtCleared

                # El eco de lo que se pagó por cada corrección (FEAT-FBK-010).
                # Proyección y no contrato: `Credits` no publica ninguno.
                - LectoresBeta\Feedback\Correction\Application\Event\CreditsAdded
                - LectoresBeta\Feedback\Correction\Application\Event\CreditsSpent
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\CorrectionStarted
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\CorrectionResumed
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\CorrectionDraftDiscarded
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\FeedbackSubmitted
                - LectoresBeta\Work\Catalogue\Application\Event\ChapterCorrectabilityChanged
                - LectoresBeta\Work\Catalogue\Application\Event\ChapterPriceChanged
                - LectoresBeta\Work\Catalogue\Application\Event\FeedbackSubmitted

                # Alguien ha empezado a corregir: a partir de ahí, editar ese
                # capítulo cuesta una copia (FEAT-WRK-005).
                - LectoresBeta\Work\Chapter\Application\Event\CorrectionStarted

                # Mover o quitar un capítulo cambia dónde acaba la obra, y con
                # ello lo que cuesta corregir dos de ellos (FEAT-WRK-003).
                - LectoresBeta\Credits\Pricing\Application\Event\ChaptersReordered
                - LectoresBeta\Credits\Pricing\Application\Event\ChapterRemoved

                # El autor retira su obra: ya no hay nada que leer, así que
                # los accesos de lector beta dejan de tener objeto
                # (FEAT-WRK-006).
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\WorkArchived

                # Quien tenía trabajo a medias sobre algo que acaba de
                # cerrarse: tres causas, un aviso (FEAT-MOD-003 RN-4,
                # FEAT-WRK-006 RN-4, FEAT-WRK-008 RN-5).
                - LectoresBeta\Feedback\Correction\Application\Event\WorkBlockedByModeration
                - LectoresBeta\Feedback\Correction\Application\Event\WorkArchived
                - LectoresBeta\Feedback\Correction\Application\Event\ChapterVisibilityChanged
                - LectoresBeta\Notification\Delivery\Application\Event\CorrectionClosed

                # Y el bloqueo que un moderador levanta, que ejecuta `Work`
                # igual que el que impone (FEAT-MOD-003 RN-7).
                - LectoresBeta\Work\Manuscript\Application\Event\ModerationBlockLifted
                # Lo que alimenta las sugerencias de autor (FEAT-COM-016).
                # `Community` no consulta las tablas de `User` ni las de
                # `Work`: recibe los hechos y mantiene su propia proyección.
                - LectoresBeta\Community\Recommendation\Application\Event\LiteraryPreferencesUpdated
                - LectoresBeta\Community\Recommendation\Application\Event\AuthorSubscribed
                - LectoresBeta\Community\Recommendation\Application\Event\AuthorUnsubscribed
                - LectoresBeta\Community\Recommendation\Application\Event\WorkPublished

                - LectoresBeta\Notification\Delivery\Application\Event\UserRegistered
                - LectoresBeta\Notification\Delivery\Application\Event\ActivationEmailRequested
                - LectoresBeta\Notification\Delivery\Application\Event\PasswordResetRequested
                - LectoresBeta\Notification\Delivery\Application\Event\PasswordChanged
                - LectoresBeta\Notification\Delivery\Application\Event\EmailChangeRequested
                - LectoresBeta\Notification\Delivery\Application\Event\CreditBalanceWentNegative
                - LectoresBeta\Notification\Delivery\Application\Event\CreditDebtCleared
                - LectoresBeta\User\Profile\Application\Event\CreditBalanceChanged
                - LectoresBeta\User\Privacy\Application\Event\AuthorSubscribed
                - LectoresBeta\User\Privacy\Application\Event\AuthorUnsubscribed
                - LectoresBeta\User\Privacy\Application\Event\UserBlocked
                - LectoresBeta\User\Privacy\Application\Event\UserUnblocked
                - LectoresBeta\Reading\BetaReaderAccess\Application\Event\UserBlocked

                # Una reclamación estimada (FEAT-MOD-002). El hecho es uno y
                # lo escuchan tres contextos, cada uno con su clase y su
                # lectura: `Work` bloquea lo reclamado, `Credits` revierte lo
                # que se cobró, `Notification` avisa. `Moderation` no sabe
                # nada de eso, que es justo lo que RN-4 protege.
                - LectoresBeta\Work\Manuscript\Application\Event\ClaimUpheld
                - LectoresBeta\Credits\Account\Application\Event\ClaimUpheld
                - LectoresBeta\Notification\Delivery\Application\Event\WorkBlockedByModeration

                # El autor ha abierto la corrección: el aviso sobra
                # (FEAT-FBK-004).
                - LectoresBeta\Notification\Delivery\Application\Event\CorrectionRead

                # Y lo que la plataforma le devuelve a quien corrigió
                # (FEAT-FBK-005, FEAT-FBK-006).
                - LectoresBeta\Notification\Delivery\Application\Event\FeedbackReplied
                - LectoresBeta\Notification\Delivery\Application\Event\FeedbackRatedPositively

                # Lo que `Notification` escucha para convertir en avisos
                # (`FEAT-NOT-001`). Son hechos de `Reading` y de `Feedback`, y
                # cada contexto los modela por su cuenta: aquí llegan cuatro
                # nombres que ya están arriba, con clases distintas, y eso es
                # exactamente lo que decision:0013 hace posible.
                - LectoresBeta\Notification\Delivery\Application\Event\AccessRequested
                - LectoresBeta\Notification\Delivery\Application\Event\AccessRequestRejected
                - LectoresBeta\Notification\Delivery\Application\Event\BetaReaderAccessGranted
                - LectoresBeta\Notification\Delivery\Application\Event\BetaReaderAccessRevoked
                - LectoresBeta\Notification\Delivery\Application\Event\BetaReaderInvited
                - LectoresBeta\Notification\Delivery\Application\Event\FeedbackSubmitted

    # Los consumidores de eventos se etiquetan aquí y no con
    # #[AsMessageHandler]: viven en Application, y Application no conoce a
    # Symfony. Es la misma razón por la que los chequeos de salud se etiquetan
    # arriba, y Deptrac comprueba las dos.
    # Symfony registra los limitadores como `limiter.<nombre>` y no los
    # autoconecta por interfaz en esta versión. Se pasan a mano, que además
    # deja a la vista cuál es cuál.
    LectoresBeta\User\Authentication\Infrastructure\Controller\LogInController:
        arguments:
            $byAddress: '@limiter.login_by_ip'
            $byAccount: '@limiter.login_by_account'

    LectoresBeta\User\Account\Infrastructure\Security\ActivationResendThrottle:
        arguments:
            $byInterval: '@limiter.resend_activation_interval'
            $byDay: '@limiter.resend_activation_daily'
            $byAddress: '@limiter.resend_activation_by_ip'

    LectoresBeta\User\Account\Infrastructure\Security\PasswordResetThrottle:
        arguments:
            $byInterval: '@limiter.password_reset_interval'
            $byDay: '@limiter.password_reset_daily'
            $byAddress: '@limiter.password_reset_by_ip'

    LectoresBeta\User\Account\Infrastructure\Controller\ChangeMyPasswordController:
        arguments:
            $byAccount: '@limiter.password_change_attempts'

    LectoresBeta\User\Authentication\Infrastructure\Security\LexikAccessTokenIssuer:
        arguments:
            $lifetimeInSeconds: '%app.jwt_ttl%'

    # Los contratos publicados se enlazan **a mano**, y es la única lista de
    # alias que este fichero mantiene. Un contrato es la puerta por la que un
    # contexto entra en otro (decision:0014): conviene que abrirla sea un
    # cambio visible aquí, y no el efecto lateral de crear una clase.
    LectoresBeta\User\Account\Application\Contract\ActivationLinkProvider:
        alias: LectoresBeta\User\Account\Application\Service\IssueActivationLink

    # El mismo patrón para el enlace de recuperación (FEAT-USR-007): el token
    # es una credencial viva y no viaja por la cola; se pide al enviar.
    LectoresBeta\User\Account\Application\Contract\PasswordResetLinkProvider:
        alias: LectoresBeta\User\Account\Application\Service\IssuePasswordResetLink

    # A qué dirección escribir cuando el aviso no lleva enlace: contraseña
    # cambiada, y más adelante correo cambiado o cuenta bloqueada. Es la
    # puerta más delicada de `User` —reparte direcciones de correo— y se abre
    # porque el correo operativo *es* la defensa de la cuenta.
    LectoresBeta\User\Account\Application\Contract\MailingAddresses:
        alias: LectoresBeta\User\Account\Application\Service\ResolveMailingAddress

    LectoresBeta\Notification\Delivery\Application\Contract\UnreadNotificationCount:
        alias: LectoresBeta\Notification\Delivery\Application\Service\CountUnreadFor

    # Si alguien modera, y con qué nivel. Lo consulta `User` al autenticar,
    # porque el token no lleva roles (decision:0007) y un permiso retirado
    # tiene que dejar de valer en el acto (FEAT-MOD-004 RN-4).
    LectoresBeta\Moderation\ModeratorRole\Application\Contract\ModeratorRoles:
        alias: LectoresBeta\Moderation\ModeratorRole\Application\Service\CheckModeratorRole

    # Si una corrección se puede reclamar, y por quién (FEAT-MOD-001 RN-4,
    # RN-5). No lleva su texto: autorizar no necesita leerla.
    LectoresBeta\Feedback\Correction\Application\Contract\ClaimableCorrections:
        alias: LectoresBeta\Feedback\Correction\Application\Service\ShowClaimableCorrection

    # `RN-7` de FEAT-USR-027 vive aquí: si el contexto de al lado no responde,
    # el resto del menú se pinta igual.
    LectoresBeta\User\Profile\Application\Port\SessionSideloads:
        alias: LectoresBeta\User\Profile\Infrastructure\Composition\NotificationSideloads

    LectoresBeta\User\Account\Application\Contract\EmailChangeLinkProvider:
        alias: LectoresBeta\User\Account\Application\Service\IssueEmailChangeLink

    LectoresBeta\User\Account\Application\Contract\VisibleProfiles:
        alias: LectoresBeta\User\Account\Application\Service\ShowVisibleProfiles

    # El hermano sin filtro, y con un solo uso legítimo: la lista de a quién
    # has bloqueado (FEAT-COM-034). En cualquier otro sitio va el de arriba.
    LectoresBeta\User\Account\Application\Contract\ProfileCards:
        alias: LectoresBeta\User\Account\Application\Service\ShowVisibleProfiles

    LectoresBeta\User\Account\Application\Contract\ReaderMaturity:
        alias: LectoresBeta\User\Account\Application\Service\CheckReaderMaturity

    LectoresBeta\User\Account\Application\Contract\RegisteredUsers:
        alias: LectoresBeta\User\Account\Application\Service\CheckRegisteredUsers

    LectoresBeta\User\Account\Application\Contract\ReaderDirectory:
        alias: LectoresBeta\User\Account\Application\Service\SearchReaderDirectory

    LectoresBeta\User\Privacy\Application\Contract\AuthorAudience:
        alias: LectoresBeta\User\Privacy\Application\Service\CheckAuthorAudience

    # Los tres contadores de la cabecera del perfil (FEAT-USR-028). Ninguno es
    # de `User`, y por eso los tres entran por aquí.
    LectoresBeta\Community\Subscription\Application\Contract\SubscriptionCounts:
        alias: LectoresBeta\Community\Subscription\Application\Service\CountSubscriptions

    LectoresBeta\Work\Manuscript\Application\Contract\AuthoredWorkCount:
        alias: LectoresBeta\Work\Manuscript\Application\Service\CountAuthoredWorks

    LectoresBeta\Feedback\Correction\Application\Contract\DeliveredCorrectionCount:
        alias: LectoresBeta\Feedback\Correction\Application\Service\CountDeliveredCorrections

    LectoresBeta\Work\Chapter\Application\Contract\CorrectionBriefs:
        alias: LectoresBeta\Work\Chapter\Application\Service\ResolveCorrectionBriefs

    # Lo que hace falta para **leer** una corrección entregada, y no para
    # escribirla (FEAT-FBK-004): cómo se llama el capítulo, qué se preguntaba
    # en la versión que se respondió, y el texto de entonces.
    #
    # `AnsweredQuestionnaires` es un contrato aparte de `CorrectionBriefs` a
    # propósito: uno responde qué se pregunta **ahora** y el otro qué se
    # preguntaba **entonces**, que son dos preguntas distintas y solo la
    # segunda sirve para leer lo que llegó hace un mes.
    LectoresBeta\Work\Chapter\Application\Contract\ChapterHeadings:
        alias: LectoresBeta\Work\Chapter\Application\Service\ResolveChapterHeadings

    LectoresBeta\Work\Chapter\Application\Contract\ChapterTexts:
        alias: LectoresBeta\Work\Chapter\Application\Service\ResolveChapterText

    LectoresBeta\Work\Questionnaire\Application\Contract\AnsweredQuestionnaires:
        alias: LectoresBeta\Work\Questionnaire\Application\Service\ResolveAnsweredQuestionnaire

    LectoresBeta\Reading\BetaReaderAccess\Application\Contract\BetaReaderAccessCheck:
        alias: LectoresBeta\Reading\BetaReaderAccess\Application\Service\CheckBetaReaderAccess

    # La puerta de vuelta: `Reading` pregunta a `Work` por la obra antes de
    # dejar que nadie la pida. Es el primer ciclo entre contextos y tiene su
    # propia decisión (decision:0015); lo que lo mantiene inofensivo es que
    # ninguna de las dos implementaciones llama a la otra mientras responde.
    LectoresBeta\Work\Manuscript\Application\Contract\WorkAccessBriefs:
        alias: LectoresBeta\Work\Manuscript\Application\Service\ResolveWorkAccessBriefs

    # La otra mitad del contenido sensible (FEAT-WRK-017, FEAT-USR-043): el
    # autor declara qué hay y el lector decide qué quiere, así que quien
    # construye una lista de obras necesita saber qué ha excluido.
    LectoresBeta\User\Preferences\Application\Contract\ReaderContentPreferences:
        alias: LectoresBeta\User\Preferences\Application\Service\ResolveContentPreferences

    LectoresBeta\User\Profile\Application\Contract\GenreCatalogue:
        alias: LectoresBeta\User\Profile\Application\Service\CheckGenreCatalogue

    LectoresBeta\Notification\Delivery\Application\Handler\SendActivationEmail:
        arguments:
            # La URL es del frontend, no de la API: el enlace del correo abre
            # una página que extrae el token y lo envía en el cuerpo, para que
            # no quede en los logs del servidor ni en el historial.
            $activationUrlTemplate: '%env(ACTIVATION_URL_TEMPLATE)%'
        tags:
            # Dos hechos, un trabajo: darse de alta y pedir el enlace otra vez
            # (FEAT-USR-021) significan lo mismo para este contexto.
            - { name: messenger.message_handler, method: registered }
            - { name: messenger.message_handler, method: requested }

    LectoresBeta\Notification\Delivery\Application\Handler\SendPasswordResetEmail:
        arguments:
            # La página que recoge el token y lo manda en el cuerpo, para que
            # no quede en los logs del servidor ni en el historial.
            $resetUrlTemplate: '%env(PASSWORD_RESET_URL_TEMPLATE)%'
        tags:
            - { name: messenger.message_handler }

    # El aviso que hace que robar una cuenta se note. Llega por los dos
    # caminos —cambio desde dentro y restablecimiento— porque quien no hizo
    # ninguna de las dos cosas necesita enterarse en los dos casos.
    LectoresBeta\Notification\Delivery\Application\Handler\SendPasswordChangedNotice:
        tags:
            - { name: messenger.message_handler }

    # Los dos correos de un cambio de dirección: el enlace a la nueva y el
    # aviso a la anterior, que es la única defensa de quien ha perdido el
    # control de su sesión.
    LectoresBeta\Notification\Delivery\Application\Handler\SendEmailChangeEmails:
        arguments:
            $confirmUrlTemplate: '%env(EMAIL_CHANGE_URL_TEMPLATE)%'
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Shared\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $directory: '%app.storage_dir%'

    LectoresBeta\Notification\Delivery\Infrastructure\Mail\SymfonyMailer:
        arguments:
            $sender: '%env(MAILER_SENDER)%'

    LectoresBeta\Credits\Account\Application\Handler\GrantWelcomeCredits:
        arguments:
            # decision:0006 §5. Cambiarlo afecta solo a las activaciones
            # posteriores: un movimiento es inmutable (FEAT-CRD-002 RN-8).
            $welcomeCredits: '%app.welcome_credits%'
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Credits\Pricing\Domain\Service\ChapterPricing:
        arguments:
            $wordsPerReadingCredit: '%app.pricing.words_per_reading_credit%'
            $wordsPerWritingCredit: '%app.pricing.words_per_writing_credit%'
            $wordsPerUnboundedQuestion: '%app.pricing.words_per_unbounded_question%'
            $minPrice: '%app.pricing.min_price%'
            $maxPrice: '%app.pricing.max_price%'

    LectoresBeta\Credits\Pricing\Application\Handler\PriceChapterOnContentUpdate:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Credits\Pricing\Application\Handler\RepriceWorkOnQuestionnaireUpdate:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Credits\Pricing\Application\Handler\RepriceWorkOnStructureChange:
        tags:
            - { name: messenger.message_handler, method: reordered }
            - { name: messenger.message_handler, method: removed }

    LectoresBeta\Credits\Pricing\Application\Handler\QuoteCorrectionOnStart:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Credits\Pricing\Application\Handler\DropQuotationOnDraftDiscarded:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Credits\Account\Application\Handler\ChargeCorrectionOnFeedbackSubmitted:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Feedback\Correction\Application\Handler\TrackChapterCorrectability:
        tags:
            - { name: messenger.message_handler }

    # Lo que el descubierto significa aquí (FEAT-CRD-018): el corrector cobra
    # siempre, y lo que se retiene es la lectura de lo entregado, no el pago.
    # Dos hechos, un trabajo: lo que se cobró por una corrección y lo que una
    # reclamación estimada retira después.
    # Tres hechos, un trabajo: avisar a quien tenía una corrección a medias
    # sobre algo que acaba de dejar de estar disponible.
    LectoresBeta\Feedback\Correction\Application\Handler\CloseDraftsOnContentWithdrawn:
        tags:
            - { name: messenger.message_handler, method: blocked }
            - { name: messenger.message_handler, method: archived }
            - { name: messenger.message_handler, method: hidden }

    LectoresBeta\Feedback\Correction\Application\Handler\TrackCorrectionEarnings:
        tags:
            - { name: messenger.message_handler, method: earned }
            - { name: messenger.message_handler, method: reversed }

    LectoresBeta\Feedback\Correction\Application\Handler\TrackCorrectionLocking:
        tags:
            - { name: messenger.message_handler, method: wentNegative }
            - { name: messenger.message_handler, method: debtCleared }

    # Empezar y reanudar conceden igual aquí, y son dos hechos porque en
    # `Credits` no lo son: reanudar no toma hueco ni fija precio.
    LectoresBeta\Reading\BetaReaderAccess\Application\Handler\GrantAccessWhileCorrecting:
        tags:
            - { name: messenger.message_handler, method: started }
            - { name: messenger.message_handler, method: resumed }

    LectoresBeta\Reading\BetaReaderAccess\Application\Handler\RevokeAccessOnDraftDiscarded:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Reading\BetaReaderAccess\Application\Handler\MarkAccessEarnedOnFeedbackSubmitted:
        tags:
            - { name: messenger.message_handler }

    # La copia del grafo de seguidores que `User` necesita para resolver las
    # audiencias `FOLLOWERS` (FEAT-COM-010). Las dos mitades: sin la segunda,
    # quien deja de seguir seguiría contando como seguidor.
    # La copia del saldo, que `User` necesita para pintar el menú en una sola
    # petición. Es una proyección y no un contrato porque `Credits` no publica
    # ninguno, ni siquiera de consulta (AGENTS.md, decision:0002).
    LectoresBeta\User\Profile\Application\Handler\TrackCreditBalance:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\User\Privacy\Application\Handler\RememberFollower:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\User\Privacy\Application\Handler\ForgetFollower:
        tags:
            - { name: messenger.message_handler }

    # La copia de los bloqueos, que es lo que hace que un bloqueo venza a
    # cualquier ajuste de privacidad (FEAT-COM-034).
    LectoresBeta\User\Privacy\Application\Handler\RememberBlock:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\User\Privacy\Application\Handler\ForgetBlock:
        tags:
            - { name: messenger.message_handler }

    # Y lo que un bloqueo significa para una obra inédita, que lo decide
    # `Reading` y no `Community`.
    LectoresBeta\Reading\BetaReaderAccess\Application\Handler\RevokeAccessOnBlock:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Reading\BetaReaderAccess\Application\Handler\RevokeAccessOnWorkArchived:
        tags:
            - { name: messenger.message_handler }

    # Quién ejecuta el bloqueo de una obra reclamada: `Work`, porque es un
    # cambio en el ciclo de vida de la obra y ese es su modelo
    # (FEAT-MOD-003). Si lo escribiera `Moderation`, dos contextos
    # gobernarían el mismo dato.
    LectoresBeta\Work\Manuscript\Application\Handler\BlockContentOnClaimUpheld:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Work\Manuscript\Application\Handler\UnblockContentOnBlockLifted:
        tags:
            - { name: messenger.message_handler }

    # Y qué significa esa misma decisión para el saldo, que lo decide
    # `Credits` a solas: el hecho no lleva importes.
    LectoresBeta\Credits\Account\Application\Handler\ReverseCorrectionOnClaimUpheld:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Work\Chapter\Application\Handler\MarkChapterVersionRead:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Work\Catalogue\Application\Handler\TrackCorrectability:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Work\Catalogue\Application\Handler\TrackChapterPrice:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Work\Catalogue\Application\Handler\CountDeliveredCorrection:
        tags:
            - { name: messenger.message_handler }

    # Los avisos in-app (`FEAT-NOT-001`). `Notification` no origina nada: todo
    # lo que hace entra por aquí.
    # El correo de bloqueo (FEAT-MOD-003 RN-8b). Lleva la dirección de
    # recurso porque un recurso que no se sabe dónde presentar no existe, y
    # la dirección es configuración: en un evento quedaría congelada en cada
    # mensaje que estuviera esperando en la cola.
    LectoresBeta\Notification\Delivery\Application\Handler\SendWorkBlockedNotice:
        arguments:
            $appealsAddress: '%env(MODERATION_APPEALS_EMAIL)%'
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheReaderOfAClosedCorrection:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Notification\Delivery\Application\Handler\RetireTheCorrectionNotice:
        tags:
            - { name: messenger.message_handler }

    # Dos hechos, un trabajo: contestar y valorar significan lo mismo para
    # quien corrigió — que el autor hizo algo con su trabajo.
    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheReaderOfAnAnsweredCorrection:
        tags:
            - { name: messenger.message_handler, method: replied }
            - { name: messenger.message_handler, method: rated }

    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheAuthorOfAnAccessRequest:
        tags:
            - { name: messenger.message_handler }

    # Dos etiquetas para una clase, que es la única de todo el proyecto que lo
    # necesita: conceder y rechazar son el mismo aviso con distinto desenlace,
    # y separarlas en dos clases dejaría que alguien añadiera un tercer
    # desenlace sin mirar el otro. El tipo de hecho lo deduce Symfony del
    # parámetro de cada método.
    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheReaderOfAResolvedRequest:
        tags:
            - { name: messenger.message_handler, method: granted }
            - { name: messenger.message_handler, method: rejected }

    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheInvitedReader:
        tags:
            - { name: messenger.message_handler }

    # El aviso que saldó la deuda de `FEAT-COM-034` y `FEAT-RDG-010`: quien
    # pierde el acceso deja de poder entregar lo que estaba escribiendo, y
    # hasta ahora nada se lo decía.
    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheReaderOfARevokedAccess:
        tags:
            - { name: messenger.message_handler }

    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheAuthorOfACorrection:
        tags:
            - { name: messenger.message_handler }

    # Los dos cruces del descubierto. El de bajada explica la salida, y el de
    # subida existe porque el desbloqueo es automático y, por tanto, invisible.
    LectoresBeta\Notification\Delivery\Application\Handler\NotifyTheAuthorAboutTheirDebt:
        tags:
            - { name: messenger.message_handler, method: wentNegative }
            - { name: messenger.message_handler, method: debtCleared }

    # El DSN del transporte es configuración, y traducirla a una dependencia
    # tipada es trabajo de Infrastructure: ni Domain ni Application leen
    # variables de entorno.
    LectoresBeta\Shared\Infrastructure\Health\MessageBrokerHealthCheck:
        arguments:
            $transportDsn: '%env(MESSENGER_TRANSPORT_DSN)%'
