parameters:
    app.jwt_ttl: 900          # 15 minutos — decision:0007
    app.welcome_credits: 10   # decision:0006

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Autoregistro de todo el código propio, con dos exclusiones.
    #
    # El dominio NO se registra como servicio: sus objetos se construyen con
    # `new`, no se inyectan. Un agregado que el contenedor sabe crear acaba
    # teniendo dependencias de infraestructura.
    #
    # Los controladores son servicios normales: llevan el atributo
    # #[AsController] de Symfony, que ya les pone la etiqueta
    # `controller.service_arguments`. No hace falta registrarlos aparte, y
    # así el atributo se queda donde debe estar, en Infrastructure.
    LectoresBeta\:
        resource: '../src/'
        exclude:
            - '../src/*/*/Domain/'
            - '../src/Shared/Domain/'
            - '../src/Shared/Infrastructure/Symfony/Kernel.php'
