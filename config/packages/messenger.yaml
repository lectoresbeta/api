framework:
    messenger:
        failure_transport: failed

        transports:
            # Eventos de integración entre bounded contexts.
            # RabbitMQ es el transporte del proyecto (AGENTS.md).
            integration:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # JSON y no la serialización nativa de PHP. Un evento de
                # integración es un contrato público entre contextos: su
                # formato en el cable no puede depender del nombre de una
                # clase ni de sus propiedades privadas, porque entonces
                # renombrar una clase rompe a los consumidores.
                serializer: messenger.transport.symfony_serializer
                options:
                    exchange:
                        name: lectoresbeta.events
                        type: topic
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Todo evento de integración lleva el marcador y va a RabbitMQ.
            # Los handlers viven en el contexto que consume, nunca en el que
            # publica.
            LectoresBeta\Shared\Domain\Event\IntegrationEvent: integration

when@test:
    framework:
        messenger:
            transports:
                integration: 'in-memory://'
