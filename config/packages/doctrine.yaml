doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true
        profiling_collect_backtrace: '%kernel.debug%'

        # Aquí había un `schema_filter` que ocultaba
        # `doctrine_migration_versions`, para que `migrations:diff` no
        # propusiera borrarla. Se ha quitado porque **rompía las migraciones**:
        # el filtro es de la conexión, así que también se lo ocultaba al
        # almacén de metadatos de Doctrine Migrations, que dejaba de verla e
        # intentaba crearla otra vez. Toda migración posterior a la primera
        # moría con «relation already exists».
        #
        # No hace falta: DoctrineBundle ya excluye esa tabla del diff por su
        # cuenta cuando está instalado MigrationsBundle. Comprobado con un
        # `migrations:diff` sobre la base al día, que sale vacío.


    orm:
        auto_generate_proxy_classes: true
        # PHP 8.4 trae objetos perezosos nativos; Doctrine 3 los exige en esa
        # versión en lugar de los lazy ghosts de symfony/var-exporter.
        enable_native_lazy_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false

        # Un mapeo por concepto de negocio, con el XML dentro de su
        # Infrastructure.
        #
        # XML y no atributos: AGENTS.md exige que el dominio no dependa de
        # Doctrine, y un atributo `#[ORM\Entity]` sobre un agregado es
        # exactamente esa dependencia.
        #
        # Una entrada por concepto y no una por contexto: el driver
        # «simplificado» de Doctrine deriva el nombre del fichero del espacio
        # de nombres que le sobra al prefijo, así que un prefijo por contexto
        # obligaría a llamar al fichero `Account.Domain.Entity.User.orm.xml` y
        # a dejarlo en la raíz del contexto, fuera de Infrastructure. Con un
        # prefijo por concepto el fichero se llama `User.orm.xml` y vive donde
        # debe. La lista es larga; ese es el precio de tenerlo todo explícito.
        mappings:
            CommunityInteraction:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Community/Interaction/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'LectoresBeta\Community\Interaction\Domain\Entity'
                alias: CommunityInteraction
            CommunityMessaging:
