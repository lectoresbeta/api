security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

        # El agregado del dominio no implementa `UserInterface` —no debe
        # conocer a Symfony— pero su contraseña se cifra con la misma política
        # configurada aquí, a través de `SymfonyPasswordHasher`. Nombrarlo en
        # configuración no acopla nada: la alternativa sería un
        # `password_hash()` suelto con una política paralela.
        LectoresBeta\User\Account\Domain\Entity\User: 'auto'

    providers:
        # Resuelve el `sub` del token contra la base de datos en cada
        # petición autenticada. Es lo que cierra parte de la ventana de
        # quince minutos de decision:0007: una cuenta bloqueada o eliminada
        # deja de autenticar en el acto, aunque su token siga firmado.
        app_users:
            id: LectoresBeta\User\Authentication\Infrastructure\Security\AuthenticatedUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Salud: tiene que responder antes de que nadie pueda autenticarse, y
        # lo consultan sondas que no tienen credenciales. Va fuera de
        # `/api/v1` a propósito (ver HealthController).
        health:
            pattern: ^/health(/|$)
            security: false

        # Endpoints públicos: registro, activación, login, enlaces públicos.
        #
        # Los patrones llevan `(/|$)` al final, y no es cosmético: sin él,
        # `^/auth` deja también `/authors` sin autenticar, y nadie se entera
        # hasta que ese endpoint existe.
        public:
            pattern: ^/api/v1/(auth|public|legal|genres|content-warnings)(/|$)
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: app_users
            jwt: ~

    access_control:
        - { path: '^/api/v1/admin(/|$)', roles: ROLE_MODERATOR }

        # El perfil ajeno se abre sin sesión (FEAT-USR-014, FEAT-USR-035): es
        # una URL que se comparte. Va en `access_control` y no en un firewall
        # sin seguridad a propósito — así un visitante con sesión sigue siendo
        # reconocido, que es lo que permite que su titular se vea a sí mismo
        # aunque haya restringido su perfil.
        - { path: '^/api/v1/(users|profiles)/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }

        # Y sus listas de seguidos y seguidores (FEAT-COM-027), por lo mismo:
        # son parte de ese perfil. Solo el `GET` de esas dos, no cualquier
        # subrecurso — `/users/{id}/subscription` es la acción de seguir, y
        # esa sí exige sesión.
        - { path: '^/api/v1/users/[^/]+/(subscriptions|subscribers)$', methods: [GET], roles: PUBLIC_ACCESS }

        # Los ficheros públicos (FEAT-USR-037): un avatar aparece en perfiles
        # que se abren sin sesión, así que exigirla haría imposible pintarlos.
        # Qué es público lo decide el controlador por la carpeta, no esta
        # línea: la original vive en otra y no se sirve por aquí.
        - { path: '^/api/v1/media/', methods: [GET], roles: PUBLIC_ACCESS }

        # Confirmar un cambio de correo (FEAT-USR-040): el enlace se abre
        # donde esté abierto el buzón nuevo, que muchas veces es otro
        # dispositivo. Lo que autoriza es el token, de un solo uso.
        - { path: '^/api/v1/me/email-change/confirm$', methods: [POST], roles: PUBLIC_ACCESS }

        # Los textos legales vigentes (FEAT-USR-024): el formulario de alta
        # los necesita antes de que exista ninguna sesión.
        - { path: '^/api/v1/legal/documents$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext

            # Cifrar de verdad en cada test funcional cuesta cientos de
            # milisegundos por alta y no comprueba nada que no compruebe ya
            # Symfony.
            LectoresBeta\User\Account\Domain\Entity\User:
                algorithm: plaintext
