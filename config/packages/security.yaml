security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

        # El agregado del dominio no implementa `UserInterface` —no debe
        # conocer a Symfony— pero su contraseña se cifra con la misma política
        # configurada aquí, a través de `SymfonyPasswordHasher`. Nombrarlo en
        # configuración no acopla nada: la alternativa sería un
        # `password_hash()` suelto con una política paralela.
        LectoresBeta\User\Account\Domain\Entity\User: 'auto'

    providers:
        # Resuelve el `sub` del token contra la base de datos en cada
        # petición autenticada. Es lo que cierra parte de la ventana de
        # quince minutos de decision:0007: una cuenta bloqueada o eliminada
        # deja de autenticar en el acto, aunque su token siga firmado.
        app_users:
            id: LectoresBeta\User\Authentication\Infrastructure\Security\AuthenticatedUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Salud: tiene que responder antes de que nadie pueda autenticarse, y
        # lo consultan sondas que no tienen credenciales. Va fuera de
        # `/api/v1` a propósito (ver HealthController).
        health:
            pattern: ^/health(/|$)
            security: false

        # Endpoints públicos: registro, activación, login, enlaces públicos.
        #
        # Los patrones llevan `(/|$)` al final, y no es cosmético: sin él,
        # `^/auth` deja también `/authors` sin autenticar, y nadie se entera
        # hasta que ese endpoint existe.
        public:
            pattern: ^/api/v1/(auth|public|legal|genres|content-warnings)(/|$)
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: app_users
            jwt: ~

    access_control:
        - { path: '^/api/v1/admin(/|$)', roles: ROLE_MODERATOR }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext

            # Cifrar de verdad en cada test funcional cuesta cientos de
            # milisegundos por alta y no comprueba nada que no compruebe ya
            # Symfony.
            LectoresBeta\User\Account\Domain\Entity\User:
                algorithm: plaintext
