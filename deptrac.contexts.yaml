# Aislamiento entre bounded contexts.
#
# Ningún contexto puede depender de las clases internas de otro. La
# comunicación ocurre por eventos de integración sobre Messenger, o por
# contratos de consulta explícitos.
#
# `Credits` tiene aislamiento reforzado: es regla dura de AGENTS.md y de
# docs/decisions/0002-credits-as-isolated-bounded-context.md.
parameters:
  # deptrac 2.x lee analyser.internal_tag y analyser.types sin aplicar
  # valores por defecto, y avisa si faltan. Los declaramos explícitamente.
  analyser:
    internal_tag: null
    types:
      - class
      - function
  paths:
    - ./src
  layers:
    - name: User
      collectors: [{ type: directory, value: src/User/.* }]
    - name: Work
      collectors: [{ type: directory, value: src/Work/.* }]
    - name: Reading
      collectors: [{ type: directory, value: src/Reading/.* }]
    - name: Feedback
      collectors: [{ type: directory, value: src/Feedback/.* }]
    - name: Community
      collectors: [{ type: directory, value: src/Community/.* }]
    - name: Credits
      collectors: [{ type: directory, value: src/Credits/.* }]
    - name: Moderation
      collectors: [{ type: directory, value: src/Moderation/.* }]
    - name: Notification
      collectors: [{ type: directory, value: src/Notification/.* }]
    - name: Shared
      collectors: [{ type: directory, value: src/Shared/.* }]

    # Todo lo que no es nuestro. No es un contexto: esta capa existe sólo para
    # que `--fail-on-uncovered` pueda seguir vigilando lo que sí lo es.
    - name: Vendor
      collectors: [{ type: classLike, value: '^(?!LectoresBeta\\).*' }]

  ruleset:
    # Todos pueden usar Shared y las librerías de terceros. Nadie puede usar a
    # ningún otro contexto.
    User: [Shared, Vendor]
    Work: [Shared, Vendor]
    Reading: [Shared, Vendor]
    Feedback: [Shared, Vendor]
    Community: [Shared, Vendor]
    Credits: [Shared, Vendor]
    Moderation: [Shared, Vendor]
    Notification: [Shared, Vendor]

    # Shared es genérico: no conoce ningún contexto de negocio.
    Shared: [Vendor]

    Vendor: ~
