# Aislamiento entre bounded contexts.
#
# Ningún contexto puede depender de las clases internas de otro. La
# comunicación ocurre por eventos de integración sobre Messenger, o por
# contratos de consulta explícitos.
#
# `Credits` tiene aislamiento reforzado: es regla dura de AGENTS.md y de
# docs/decisions/0002-credits-as-isolated-bounded-context.md.
parameters:
  # deptrac 2.x lee analyser.internal_tag y analyser.types sin aplicar
  # valores por defecto, y avisa si faltan. Los declaramos explícitamente.
  analyser:
    internal_tag: null
    types:
      - class
      - function
  paths:
    - ./src
  layers:
    # Los contratos publicados: lo único de un contexto que otro puede
    # mirar (decision:0014). Se declara antes que los contextos porque
    # cada uno de ellos se define excluyendo esta carpeta.
    - name: Contracts
      collectors: [{ type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }]

    - name: User
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/User/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Work
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Work/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Reading
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Reading/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Feedback
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Feedback/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Community
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Community/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Credits
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Credits/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Moderation
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Moderation/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Notification
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Notification/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }
    - name: Shared
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Shared/.* }
          must_not:
            - { type: directory, value: src/[^/]*/[^/]*/Application/Contract/.* }

    # Todo lo que no es nuestro. No es un contexto: esta capa existe sólo para
    # que `--fail-on-uncovered` pueda seguir vigilando lo que sí lo es.
    - name: Vendor
      collectors: [{ type: classLike, value: '^(?!LectoresBeta\\).*' }]

  ruleset:
    # Todos pueden usar Shared, los contratos publicados y las librerías de
    # terceros. Nadie puede usar las clases internas de ningún otro contexto.
    #
    # `Contracts` es la única puerta, y es deliberadamente estrecha: un
    # contrato **pregunta**, nunca ordena (decision:0014). `Credits` no
    # publica ninguno, porque aplicar un efecto de crédito desde fuera está
    # prohibido por AGENTS.md.
    User: [Shared, Contracts, Vendor]
    Work: [Shared, Contracts, Vendor]
    Reading: [Shared, Contracts, Vendor]
    Feedback: [Shared, Contracts, Vendor]
    Community: [Shared, Contracts, Vendor]
    Credits: [Shared, Contracts, Vendor]
    Moderation: [Shared, Contracts, Vendor]
    Notification: [Shared, Contracts, Vendor]

    # Shared es genérico: no conoce ningún contexto de negocio.
    Shared: [Vendor]

    # Un contrato es una interfaz y tipos propios. Si necesitase algo del
    # contexto que lo publica, dejaría de ser un contrato y pasaría a ser
    # una rendija por la que se ve el modelo interno.
    Contracts: [Shared, Vendor]

    Vendor: ~
