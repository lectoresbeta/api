# Rutas del bounded context `Community`.
#
# El nombre de cada ruta es su `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).
#
# Formato:
#
#     <operationId>:
#         path: /api/v1/...
#         controller: LectoresBeta\Community\<Concepto>\Infrastructure\Controller\<Algo>Controller::__invoke
#         methods: [POST]
#
# Convención completa: docs/api/conventions/routing.md

# Seguir a un autor (FEAT-COM-010). El primer endpoint de este contexto.
#
# `PUT` y `DELETE` sobre el mismo recurso porque lo que se manipula es **el
# estado de la relación**, no un suceso: repetir cualquiera de los dos deja el
# mundo igual.

getAuthorSubscription:
    path: /api/v1/users/{userId}/subscription
    controller: LectoresBeta\Community\Subscription\Infrastructure\Controller\GetAuthorSubscriptionController::__invoke
    methods: [GET]

subscribeToAuthor:
    path: /api/v1/users/{userId}/subscription
    controller: LectoresBeta\Community\Subscription\Infrastructure\Controller\SubscribeToAuthorController::__invoke
    methods: [PUT]

unsubscribeFromAuthor:
    path: /api/v1/users/{userId}/subscription
    controller: LectoresBeta\Community\Subscription\Infrastructure\Controller\UnsubscribeFromAuthorController::__invoke
    methods: [DELETE]

# Seguidos y seguidores (FEAT-COM-027). La misma tabla por sus dos extremos,
# y dos rutas en vez de un parámetro `direction`: son dos preguntas distintas,
# y un parámetro que cambia el significado de la respuesta acaba mal
# documentado.
#
# Públicas, como el perfil al que pertenecen. Lo que no es público no sale,
# ni el perfil entero ni ninguna de sus filas.

listAuthorSubscriptions:
    path: /api/v1/users/{userId}/subscriptions
    controller: LectoresBeta\Community\Subscription\Infrastructure\Controller\ListAuthorSubscriptionsController::__invoke
    methods: [GET]

listSubscribers:
    path: /api/v1/users/{userId}/subscribers
    controller: LectoresBeta\Community\Subscription\Infrastructure\Controller\ListSubscribersController::__invoke
    methods: [GET]

# Bloquear (FEAT-COM-034). `PUT` y `DELETE` sobre el estado de la relación,
# como seguir, y por lo mismo: repetir cualquiera de los dos deja el mundo
# igual.
#
# La lista de bloqueados **hace falta**: sin ella el bloqueo sería
# irreversible en la práctica, porque nadie recuerda el `@usuario` de quien
# bloqueó hace tres meses.

blockUser:
    path: /api/v1/users/{userId}/block
    controller: LectoresBeta\Community\Relationship\Infrastructure\Controller\BlockUserController::__invoke
    methods: [PUT]

unblockUser:
    path: /api/v1/users/{userId}/block
    controller: LectoresBeta\Community\Relationship\Infrastructure\Controller\UnblockUserController::__invoke
    methods: [DELETE]

listBlockedUsers:
    path: /api/v1/me/blocked-users
    controller: LectoresBeta\Community\Relationship\Infrastructure\Controller\ListBlockedUsersController::__invoke
    methods: [GET]

# El muro y lo que se escribe en él (`FEAT-COM-001`, `FEAT-COM-002`).
#
# El listado exige sesión: sin saber quién mira no se puede resolver qué
# publicaciones `FOLLOWERS` le alcanzan.
listPosts:
    path: /api/v1/posts
    controller: LectoresBeta\Community\Post\Infrastructure\Controller\ListPostsController::__invoke
    methods: [GET]

createPost:
    path: /api/v1/posts
    controller: LectoresBeta\Community\Post\Infrastructure\Controller\CreatePostController::__invoke
    methods: [POST]

editPost:
    path: /api/v1/posts/{postId}
    controller: LectoresBeta\Community\Post\Infrastructure\Controller\EditPostController::__invoke
    methods: [PATCH]

deletePost:
    path: /api/v1/posts/{postId}
    controller: LectoresBeta\Community\Post\Infrastructure\Controller\DeletePostController::__invoke
    methods: [DELETE]

# La imagen se pide **por la publicación** y no desde la carpeta pública: una
# publicación para seguidores es una regla de privacidad, y una clave difícil
# de adivinar no es una comprobación.
getPostImage:
    path: /api/v1/posts/{postId}/image
    controller: LectoresBeta\Community\Post\Infrastructure\Controller\GetPostImageController::__invoke
    methods: [GET]

# Los comentarios de una publicación (`FEAT-COM-006`).
#
# Solo comenta quien puede ver la publicación: con audiencias distintas de
# «cualquiera», comentar es la otra vía por la que alguien tocaría contenido
# que no debería ver.
listPostComments:
    path: /api/v1/posts/{postId}/comments
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\ListPostCommentsController::__invoke
    methods: [GET]

createPostComment:
    path: /api/v1/posts/{postId}/comments
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\CreatePostCommentController::__invoke
    methods: [POST]

editPostComment:
    path: /api/v1/comments/{commentId}
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\EditPostCommentController::__invoke
    methods: [PATCH]

deletePostComment:
    path: /api/v1/comments/{commentId}
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\DeletePostCommentController::__invoke
    methods: [DELETE]

# Las respuestas de un comentario (`FEAT-COM-031`).
#
# Los hilos son planos: si `commentId` es una respuesta, el servidor resuelve
# al comentario raíz. El cliente no necesita saber cuál es.
listCommentReplies:
    path: /api/v1/comments/{commentId}/replies
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\ListCommentRepliesController::__invoke
    methods: [GET]

replyToComment:
    path: /api/v1/comments/{commentId}/replies
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\ReplyToCommentController::__invoke
    methods: [POST]

# Repostear (`FEAT-COM-019`). El `POST` alterna y el `DELETE` quita: dicen
# cosas distintas, y por eso están los dos.
repostPost:
    path: /api/v1/posts/{postId}/repost
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\RepostPostController::__invoke
    methods: [POST]

undoRepost:
    path: /api/v1/posts/{postId}/repost
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\UndoRepostController::__invoke
    methods: [DELETE]

# Paso 3 del onboarding (`FEAT-COM-016`). Responde siempre `200`: que no haya
# autores que sugerir es un estado normal de una plataforma recién lanzada, y
# quien decide si el paso se enseña es el servidor.
listAuthorSuggestions:
    path: /api/v1/onboarding/author-suggestions
    controller: LectoresBeta\Community\Recommendation\Infrastructure\Controller\ListAuthorSuggestionsController::__invoke
    methods: [GET]

# El bloque «todavía no sigues a ningún autor» del muro (`FEAT-COM-018`).
#
# Ruta aparte y **mismo caso de uso** que el paso 3 del onboarding: el
# contexto de uso es distinto y es previsible que el tamaño de la lista
# diverja, pero duplicar el criterio sería tener dos sitios donde cambiarlo.
listHomeAuthorSuggestions:
    path: /api/v1/home/author-suggestions
    controller: LectoresBeta\Community\Recommendation\Infrastructure\Controller\ListHomeAuthorSuggestionsController::__invoke
    methods: [GET]

# Los «me gusta» (`FEAT-COM-008`, `FEAT-COM-030`). `PUT` y `DELETE` y no un
# `POST` que alterne: fijan un estado, y repetirlos no suma.
#
# Ojo con el nombre: en `Feedback` una «valoración positiva» de un comentario
# otorga créditos (`FEAT-FBK-006`). Esto es un gesto social sin efecto
# económico. Comparten palabra y no concepto.

likePost:
    path: /api/v1/posts/{postId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\LikePostController::__invoke
    methods: [PUT]

unlikePost:
    path: /api/v1/posts/{postId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\UnlikePostController::__invoke
    methods: [DELETE]

# Bajo `/comments/`, que es el prefijo que este contexto ya usa para sus
# comentarios. Los de `Feedback` cuelgan de `/corrections/`.
likePostComment:
    path: /api/v1/comments/{commentId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\LikePostCommentController::__invoke
    methods: [PUT]

unlikePostComment:
    path: /api/v1/comments/{commentId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\UnlikePostCommentController::__invoke
    methods: [DELETE]

# Mensajes directos (`FEAT-COM-011`, `FEAT-COM-012`).
#
# Se escribe **a una persona** y no a una conversación: quien pulsa «Enviar
# mensaje» en un perfil no sabe si ya hay hilo, y abrir o continuar es la
# misma operación vista desde fuera.
sendDirectMessage:
    path: /api/v1/users/{userId}/messages
    controller: LectoresBeta\Community\Messaging\Infrastructure\Controller\SendDirectMessageController::__invoke
    methods: [POST]

# Bajo `/me/` porque no existe la versión de otra persona: con quién habla
# alguien no es una lista que se pueda pedir.
listMyConversations:
    path: /api/v1/me/conversations
    controller: LectoresBeta\Community\Messaging\Infrastructure\Controller\ListMyConversationsController::__invoke
    methods: [GET]

listConversationMessages:
    path: /api/v1/conversations/{conversationId}/messages
    controller: LectoresBeta\Community\Messaging\Infrastructure\Controller\ListConversationMessagesController::__invoke
    methods: [GET]

# `PUT` y no `POST`: fija un estado, y la pantalla marca al abrir y también
# con un gesto, así que la segunda llamada llega sola.
markConversationRead:
    path: /api/v1/conversations/{conversationId}/read
    controller: LectoresBeta\Community\Messaging\Infrastructure\Controller\MarkConversationReadController::__invoke
    methods: [PUT]

# Las interacciones sociales bajo el texto de un capítulo (`FEAT-COM-036`).
#
# **Comentar un capítulo no es corregirlo.** Esto cuelga de `/chapters/` igual
# que la corrección, y son dos cosas: un comentario es libre y no mueve un
# crédito; la corrección es el cuestionario del autor, hay una por lector y
# capítulo, y sí los mueve. Conviven en la misma pantalla.

likeChapter:
    path: /api/v1/chapters/{chapterId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\LikeChapterController::__invoke
    methods: [PUT]

unlikeChapter:
    path: /api/v1/chapters/{chapterId}/like
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\UnlikeChapterController::__invoke
    methods: [DELETE]

commentOnChapter:
    path: /api/v1/chapters/{chapterId}/comments
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\CommentOnChapterController::__invoke
    methods: [POST]

listChapterComments:
    path: /api/v1/chapters/{chapterId}/comments
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\ListChapterCommentsController::__invoke
    methods: [GET]

# Las cifras de la cabecera, aparte del capítulo: el capítulo lo sirve `Work`
# y esto es de `Community`. Juntarlas obligaría a uno a conocer al otro.
getChapterEngagement:
    path: /api/v1/chapters/{chapterId}/engagement
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\GetChapterEngagementController::__invoke
    methods: [GET]

# Bajo `/chapter-comments/` y no `/comments/`, que ya es de los del muro. Son
# entidades distintas con audiencias distintas, y compartir prefijo invitaría
# a creer que son la misma.
listChapterCommentReplies:
    path: /api/v1/chapter-comments/{commentId}/replies
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\ListChapterCommentRepliesController::__invoke
    methods: [GET]

deleteChapterComment:
    path: /api/v1/chapter-comments/{commentId}
    controller: LectoresBeta\Community\Interaction\Infrastructure\Controller\DeleteChapterCommentController::__invoke
    methods: [DELETE]
