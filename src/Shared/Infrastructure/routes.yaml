# Rutas de `Shared`. No son de ningún contexto de negocio: son técnicas.
#
# El nombre de cada ruta es el `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).

checkReadiness:
    path: /health
    controller: LectoresBeta\Shared\Infrastructure\Http\HealthController::ready
    methods: [GET]

checkLiveness:
    path: /health/live
    controller: LectoresBeta\Shared\Infrastructure\Http\HealthController::live
    methods: [GET]

# Los ficheros guardados (FEAT-USR-037). Técnico y no de `User`: hoy sirve
# avatares, mañana portadas, y ninguno de esos contextos es más dueño de
# «servir un fichero» que los otros.
#
# `{key}` lleva barra dentro —`avatars/<algo>.webp`—, de ahí el requisito:
# sin él, la ruta se cortaría en la primera barra.

getMediaFile:
    path: /api/v1/media/{key}
    controller: LectoresBeta\Shared\Infrastructure\Http\Media\GetMediaFileController::__invoke
    methods: [GET]
    requirements:
        key: '.+'
