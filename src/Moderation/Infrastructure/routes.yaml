# Rutas del bounded context `Moderation`. Todavía ninguna.
#
# El fichero existe vacío a propósito: quien añada el primer endpoint de
# `Moderation` no tiene que averiguar dónde va, y `config/routes.yaml` —que lo
# importa— sigue siendo el censo de contextos que exponen API.
#
# El nombre de cada ruta es su `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).
#
# Formato:
#
#     <operationId>:
#         path: /api/v1/...
#         controller: LectoresBeta\Moderation\<Concepto>\Infrastructure\Controller\<Algo>Controller::__invoke
#         methods: [POST]
#
# Convención completa: docs/api/conventions/routing.md

# El backoffice (`FEAT-MOD-004`). Todo lo que cuelga de `/api/v1/admin` exige
# `ROLE_MODERATOR` por `security.yaml`, y conceder roles exige además
# `ROLE_ADMIN`: los dos se resuelven contra la base de datos en cada petición,
# porque el token no lleva roles (`decision:0007`).
listModerators:
    path: /api/v1/admin/moderators
    controller: LectoresBeta\Moderation\ModeratorRole\Infrastructure\Controller\ListModeratorsController::__invoke
    methods: [GET]

# `PUT` porque fija un estado: qué es esa cuenta en moderación. `level: null`
# la deja en nada.
setModeratorRole:
    path: /api/v1/admin/users/{userId}/moderator-role
    controller: LectoresBeta\Moderation\ModeratorRole\Infrastructure\Controller\SetModeratorRoleController::__invoke
    methods: [PUT]

# Cuelga de `/me` y no de `/admin` a propósito: es cómo prefiere trabajar el
# moderador, no una decisión de administración (`RN-3`).
setModeratorAlerts:
    path: /api/v1/me/moderator-alerts
    controller: LectoresBeta\Moderation\ModeratorRole\Infrastructure\Controller\SetModeratorAlertsController::__invoke
    methods: [PUT]

# Presentar una reclamación (`FEAT-MOD-001`). No produce ningún efecto: pide
# que alguien mire algo.
submitClaim:
    path: /api/v1/claims
    controller: LectoresBeta\Moderation\Claim\Infrastructure\Controller\SubmitClaimController::__invoke
    methods: [POST]

# Para que denunciar no sea gritar a un buzón (`FEAT-MOD-010`).
listMyClaims:
    path: /api/v1/me/claims
    controller: LectoresBeta\Moderation\Claim\Infrastructure\Controller\ListMyClaimsController::__invoke
    methods: [GET]

# La cola del moderador (`FEAT-MOD-002`). Excluye las reclamaciones en las que
# es parte: no basta con rechazar la acción, no debe verlas (`RN-1`).
listClaims:
    path: /api/v1/admin/claims
    controller: LectoresBeta\Moderation\Review\Infrastructure\Controller\ListClaimsController::__invoke
    methods: [GET]

# Tomar y resolver, en un solo paso. No hay «asignármela» aparte: lo que
# impide que dos moderadores resuelvan la misma es el bloqueo de la fila
# mientras se decide (`RN-8`), no un estado intermedio.
reviewClaim:
    path: /api/v1/admin/claims/{claimId}/review
    controller: LectoresBeta\Moderation\Review\Infrastructure\Controller\ReviewClaimController::__invoke
    methods: [POST]
