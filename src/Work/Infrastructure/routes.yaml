# Rutas del bounded context `Work`.
#
# Son las primeras escrituras **no exentas** de exigir cuenta activada: una
# cuenta en PENDING_ACTIVATION recibe 403 aquí (FEAT-USR-025), sin que estos
# controladores tengan que saberlo.

createWork:
    path: /api/v1/works
    controller: LectoresBeta\Work\Manuscript\Infrastructure\Controller\CreateWorkController::__invoke
    methods: [POST]

addChapter:
    path: /api/v1/works/{workId}/chapters
    controller: LectoresBeta\Work\Chapter\Infrastructure\Controller\AddChapterController::__invoke
    methods: [POST]
