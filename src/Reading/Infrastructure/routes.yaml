# Rutas del bounded context `Reading`. Todavía ninguna.
#
# El fichero existe vacío a propósito: quien añada el primer endpoint de
# `Reading` no tiene que averiguar dónde va, y `config/routes.yaml` —que lo
# importa— sigue siendo el censo de contextos que exponen API.
#
# El nombre de cada ruta es su `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).
#
# Formato:
#
#     <operationId>:
#         path: /api/v1/...
#         controller: LectoresBeta\Reading\<Concepto>\Infrastructure\Controller\<Algo>Controller::__invoke
#         methods: [POST]
#
# Convención completa: docs/api/conventions/routing.md

# El camino `ON_REQUEST` (FEAT-RDG-002 y FEAT-RDG-003). Son dos fichas y un
# solo recurso: la solicitud la crea el lector y la resuelve el autor.

requestBetaReaderAccess:
    path: /api/v1/works/{workId}/access-requests
    controller: LectoresBeta\Reading\AccessRequest\Infrastructure\Controller\RequestBetaReaderAccessController::__invoke
    methods: [POST]

listWorkAccessRequests:
    path: /api/v1/works/{workId}/access-requests
    controller: LectoresBeta\Reading\AccessRequest\Infrastructure\Controller\ListWorkAccessRequestsController::__invoke
    methods: [GET]

listMyBetaReaderAccessRequests:
    path: /api/v1/me/access-requests
    controller: LectoresBeta\Reading\AccessRequest\Infrastructure\Controller\ListMyAccessRequestsController::__invoke
    methods: [GET]

cancelBetaReaderAccessRequest:
    path: /api/v1/access-requests/{requestId}
    controller: LectoresBeta\Reading\AccessRequest\Infrastructure\Controller\CancelAccessRequestController::__invoke
    methods: [DELETE]

resolveBetaReaderAccessRequest:
    path: /api/v1/access-requests/{requestId}/resolution
    controller: LectoresBeta\Reading\AccessRequest\Infrastructure\Controller\ResolveAccessRequestController::__invoke
    methods: [PUT]

# El camino `PRIVATE` (FEAT-RDG-004 y FEAT-RDG-005). Se llama
# `beta-reader-invitations` y no `invitations` porque `User` ya tiene
# invitaciones —a la plataforma— y dos cosas distintas con el mismo nombre en
# la misma API se confunden una vez y ya no se dejan de confundir.

inviteBetaReader:
    path: /api/v1/works/{workId}/beta-reader-invitations
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\InviteBetaReaderController::__invoke
    methods: [POST]

listWorkBetaReaderInvitations:
    path: /api/v1/works/{workId}/beta-reader-invitations
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\ListWorkInvitationsController::__invoke
    methods: [GET]

listMyBetaReaderInvitations:
    path: /api/v1/me/beta-reader-invitations
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\ListMyInvitationsController::__invoke
    methods: [GET]

cancelBetaReaderInvitation:
    path: /api/v1/beta-reader-invitations/{invitationId}
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\CancelInvitationController::__invoke
    methods: [DELETE]

resolveBetaReaderInvitation:
    path: /api/v1/beta-reader-invitations/{invitationId}/resolution
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\ResolveInvitationController::__invoke
    methods: [PUT]

# A quién puede invitar todavía el autor (FEAT-RDG-006). Cuelga de la obra a
# propósito: liga recorrer personas a un autor con una obra, que es la única
# razón legítima para hacerlo aquí.

searchInvitableBetaReaders:
    path: /api/v1/works/{workId}/invitable-readers
    controller: LectoresBeta\Reading\AccessInvitation\Infrastructure\Controller\SearchInvitableReadersController::__invoke
    methods: [GET]

# Quién puede leer mi obra, y retirarle el acceso (FEAT-RDG-010). Cierra
# `R-1`: se entra por tres caminos y hasta ahora no había forma de salir.
#
# El `DELETE` va sobre **la persona dentro de la obra** y no sobre un
# identificador de acceso: es lo que el autor quiere decir, y de paso sale
# idempotente.

listWorkBetaReaders:
    path: /api/v1/works/{workId}/beta-readers
    controller: LectoresBeta\Reading\BetaReaderAccess\Infrastructure\Controller\ListWorkBetaReadersController::__invoke
    methods: [GET]

revokeBetaReaderAccess:
    path: /api/v1/works/{workId}/beta-readers/{readerId}
    controller: LectoresBeta\Reading\BetaReaderAccess\Infrastructure\Controller\RevokeBetaReaderAccessController::__invoke
    methods: [DELETE]
