# Rutas del bounded context `Feedback`.
#
# El nombre de cada ruta es su `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).
#
# Formato:
#
#     <operationId>:
#         path: /api/v1/...
#         controller: LectoresBeta\Feedback\<Concepto>\Infrastructure\Controller\<Algo>Controller::__invoke
#         methods: [POST]
#
# Convención completa: docs/api/conventions/routing.md

getChapterQuestionnaire:
    path: /api/v1/chapters/{chapterId}/questionnaire
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\GetCorrectionPanelController::__invoke
    methods: [GET]

startCorrection:
    path: /api/v1/chapters/{chapterId}/corrections/start
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\StartCorrectionController::__invoke
    methods: [POST]

submitCorrection:
    path: /api/v1/chapters/{chapterId}/corrections
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\SubmitCorrectionController::__invoke
    methods: [POST]

saveCorrectionDraft:
    path: /api/v1/chapters/{chapterId}/correction/draft
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\SaveCorrectionDraftController::__invoke
    methods: [PUT]

discardCorrectionDraft:
    path: /api/v1/chapters/{chapterId}/correction/draft
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\DiscardCorrectionDraftController::__invoke
    methods: [DELETE]

# Leer lo que se ha recibido (`FEAT-FBK-004`). Hasta aquí el autor pagaba por
# una corrección que no podía abrir por ninguna vía.
listCorrectionsReceived:
    path: /api/v1/me/corrections/received
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\ListCorrectionsReceivedController::__invoke
    methods: [GET]

# La leen dos personas: su destinatario y quien la escribió.
getCorrection:
    path: /api/v1/corrections/{correctionId}
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\GetCorrectionController::__invoke
    methods: [GET]

# Aparte del detalle porque son decenas de miles de palabras que casi nunca
# hacen falta.
getCorrectedChapterText:
    path: /api/v1/corrections/{correctionId}/chapter-text
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\GetCorrectedChapterTextController::__invoke
    methods: [GET]
