# Rutas del bounded context `Feedback`.
#
# El nombre de cada ruta es su `operationId` de OpenAPI. No es cosmético: es
# lo que permite comprobar de forma mecánica que lo implementado y el contrato
# publicado no se han separado, y hay un test que lo hace
# (`tests/Unit/Architecture/RoutingConventionTest.php`).
#
# Formato:
#
#     <operationId>:
#         path: /api/v1/...
#         controller: LectoresBeta\Feedback\<Concepto>\Infrastructure\Controller\<Algo>Controller::__invoke
#         methods: [POST]
#
# Convención completa: docs/api/conventions/routing.md

getChapterQuestionnaire:
    path: /api/v1/chapters/{chapterId}/questionnaire
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\GetCorrectionPanelController::__invoke
    methods: [GET]

startCorrection:
    path: /api/v1/chapters/{chapterId}/corrections/start
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\StartCorrectionController::__invoke
    methods: [POST]

submitCorrection:
    path: /api/v1/chapters/{chapterId}/corrections
    controller: LectoresBeta\Feedback\Correction\Infrastructure\Controller\SubmitCorrectionController::__invoke
    methods: [POST]
