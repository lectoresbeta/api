server {
    listen 80;
    server_name _;
    root /app/public;

    # Todo entra por index.php. No hay ningún otro punto de entrada, así que
    # cualquier .php que apareciera bajo public/ sería un accidente.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Las obras pueden llegar por fichero y la respuesta de un capítulo es
    # texto largo: los valores por defecto de nginx se quedan cortos.
    client_max_body_size 33m;

    error_log  /dev/stderr;
    access_log /dev/stdout;
}
