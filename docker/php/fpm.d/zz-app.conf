[www]
; La otra mitad del mismo problema: php-fpm limpia el entorno de sus procesos
; hijos por defecto (`clear_env = yes`), así que las variables del contenedor
; no llegan ni siquiera a getenv().
;
; Con esto y con `variables_order = EGPCS`, lo que declara docker-compose.yaml
; es lo que ve la aplicación.
clear_env = no
