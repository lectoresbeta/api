; Ajustes de la aplicación. Lo que no aparece aquí se queda con el valor de
; php.ini-development o php.ini-production, según la etapa de la imagen.

memory_limit = 512M

; Las obras llegan hasta 75.000 palabras y se pueden subir como fichero.
upload_max_filesize = 32M
post_max_size = 33M

date.timezone = UTC

; Sin la `E`, $_ENV se queda vacío y las variables que define
; docker-compose.yaml no llegan a la aplicación.
;
; No es un detalle: Symfony Dotenv decide si una variable ya existe mirando
; $_ENV y $_SERVER —nunca getenv(), por seguridad con hilos—, así que sin esto
; el valor de `.env` gana silenciosamente al del contenedor y la aplicación
; busca PostgreSQL en 127.0.0.1 en vez de en `postgres`. Falla solo por HTTP;
; por CLI funciona, porque ahí $_SERVER sí trae el entorno.
variables_order = "EGPCS"

; Nunca en la respuesta: un error de PHP no es una respuesta de la API.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
